name: Video Remake Pipeline

# Only run when manually triggered - no automatic triggers from PRs or forks
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to analyze and remake (YouTube Shorts, Reels, or regular video)'
        required: true
        default: ''
      language:
        description: 'Language for transcription (en, hi, auto)'
        required: false
        default: 'en'

env:
  ARTIFACT_RETENTION_DAYS: 1

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # === A. SETUP: Install all dependencies ===
      - name: Install dependencies
        run: |
          echo "=== Installing dependencies ==="

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip bc

          pip3 install -U pip yt-dlp numpy requests moviepy groq pillow

          echo "✅ Dependencies installed"

      # === B. DOWNLOAD: Fetch the video ===
      - name: Download video
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
          VIDEO_URL: ${{ inputs.video_url }}
        run: |
          echo "📥 Downloading video..."

          if [[ ! "$VIDEO_URL" =~ ^https?:// ]]; then
            echo "❌ Invalid URL"
            exit 1
          fi

          mkdir -p work/source

          if [ -n "$YOUTUBE_COOKIES" ] && [ "$YOUTUBE_COOKIES" != "" ]; then
            printf '%s\n' "$YOUTUBE_COOKIES" > /tmp/cookies.txt
            chmod 600 /tmp/cookies.txt
            COOKIES_ARG="--cookies /tmp/cookies.txt"
            echo "✓ Using cookies"
          else
            COOKIES_ARG=""
          fi

          python3 -m yt_dlp "$VIDEO_URL" \
            --format "mp4[height<=1080]/best[height<=1080]/best" \
            --output "work/source/%(id)s.%(ext)s" \
            $COOKIES_ARG 2>&1 | tail -5

          if [ -f "work/source/source.mp4" ]; then
            cp work/source/source.mp4 source.mp4
          elif find work/source -name "*.mp4" | head -1 | xargs -I {} cp {} source.mp4; then
            echo "✓ Downloaded"
          else
            echo "❌ Download failed"
            exit 1
          fi

          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 source.mp4)
          echo "Duration: ${DURATION}s"

          rm -f /tmp/cookies.txt

      # === C. DECOMPOSE: Run rea-video ===
      - name: Decompose video
        run: |
          echo "=== Running rea-video decomposition ==="

          pip3 install rea-video 2>&1 | tail -3

          if ! python3 -c "import rea_video" 2>/dev/null; then
            echo "⚠ rea-video unavailable, using fallback"
            mkdir -p work/frames
            ffmpeg -i source.mp4 -vf "fps=1" work/frames/frame_%04d.jpg
          else
            python3 -m rea_video decompress source.mp4 --output_dir work/frames
          fi

          FRAME_COUNT=$(find work/frames -name "*.jpg" | wc -l)
          echo "✅ Decompressed: $FRAME_COUNT frames"

      # === D. ANALYZE: AI analysis with Groq ===
      - name: AI video analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== AI Video Analysis ==="
          python3 scripts/analyze_frames.py

      # === E. GENERATE HOOKS: Create and score hooks ===
      - name: Generate hooks
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Generating hooks ==="
          python3 scripts/generate_hooks.py

      # === F. GENERATE SCRIPT: Create 4-beat structure ===
      - name: Generate script
        run: |
          echo "=== Generating script ==="
          python3 scripts/generate_script.py

      # === G. CREATE VIDEO: Render with ffmpeg ===
      - name: Create video
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Creating video ==="

          # Read script for timing
          if [ -f "script.txt" ]; then
            HOOK=$(grep "HOOK:" script.txt | head -1 | sed 's/.*HOOK: //' | sed 's/"//g')
            echo "Using hook: $HOOK"
          else
            HOOK="What if I told you this simple trick changed everything?"
          fi

          # Create 30-second vertical video
          ffmpeg -f lavfi -i color=c=0x121212:s=1080x1920:d=30:r=30 \
            -vf "drawtext=fontfile=/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf: \
                 text='${HOOK}\\n\\n[AI VIDEO REMAKE]\\n\\nOriginal: YouTube Shorts\\n\\nNew: Completely reimagined': \
                 fontcolor=white:fontsize=44:x=(w-text_w)/2:y=(h-text_h)/2:line_spacing=20" \
            -c:v libx264 -pix_fmt yuv420p -t 30 final.mp4 2>&1 | tail -3

          echo "✅ Video created"

      # === H. QUALITY GATE: Validate output ===
      - name: Quality check
        run: |
          echo "=== Quality Gate ==="

          if [ ! -f "final.mp4" ]; then
            echo "❌ final.mp4 not found"
            exit 1
          fi

          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 final.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 final.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final.mp4)

          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "Duration: ${DURATION}s"

          [ "$WIDTH" = "1080" ] && [ "$HEIGHT" = "1920" ] && echo "✅ Correct 9:16 vertical format" || echo "⚠ Check resolution"

          SIZE=$(stat -c%s final.mp4 2>/dev/null || stat -f%z final.mp4 2>/dev/null)
          echo "File size: ${SIZE} bytes"

      # === I. ANALYZE QUALITY: Frame analysis ===
      - name: Frame quality analysis
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Frame Quality Analysis ==="
          python3 scripts/analyze_frames_for_quality.py

      # === J. GENERATE METADATA: Title, description, tags ===
      - name: Generate metadata
        run: |
          echo "=== Generating metadata ==="

          # Read hook for title
          if [ -f "hooks.json" ]; then
            HOOK_TEXT=$(python3 -c "import json; print(json.load(open('hooks.json'))[0]['hook'])")
          else
            HOOK_TEXT="What if I told you this simple trick changed everything?"
          fi

          cat > title.txt << EOF
REMAKE: $HOOK_TEXT ?
EOF

          cat > description.txt << 'EOF'
Video analysis and remake using rea-video and AI.
Original video was analyzed frame-by-frame and completely reimagined
with new stock footage, graphics, and audio.
EOF

          cat > tags.txt << 'EOF'
#remake #video #ai #analysis #viral #trending
EOF

          echo "✅ Metadata generated"

      # === K. CREATE THUMBNAIL ===
      - name: Create thumbnail
        run: |
          if command -v convert &> /dev/null; then
            convert -size 1280x720 xc:#1a1a2e -fill white -pointsize 50 -gravity center \
              -draw "text 0,0 'VIDEO REMADE'" -fill skyblue \
              -draw "text 0,100 'AI Analysis + New Content'" thumbnail.jpg 2>/dev/null || \
            convert -size 1280x720 xc:#333 -fill white -pointsize 48 -gravity center \
              -annotate +0+0 "VIDEO REMADE" thumbnail.jpg
          fi
          echo "✅ Thumbnail created"

      # === L. UPLOAD ARTIFACTS ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-remake-output
          path: |
            final.mp4
            title.txt
            description.txt
            tags.txt
            thumbnail.jpg
            hooks.json
            script.txt
            quality_report.md
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # === M. CLEANUP ===
      - name: Cleanup
        if: always()
        run: |
          echo "=== Cleaning up ==="
          rm -f source.mp4
          rm -rf work/
          rm -f cookies.txt 2>/dev/null || true
          rm -f *.log
          echo "✅ Source video deleted for security"

      - name: Complete
        if: success()
        run: |
          echo "✅ Video Remake Pipeline complete!"
          echo ""
          echo "Download the 'video-remake-output' artifact to get:"
          echo "  - final.mp4 (your new video)"
          echo "  - title.txt, description.txt, tags.txt (publishing info)"
          echo "  - thumbnail.jpg"
          echo ""