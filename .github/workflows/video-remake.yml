name: Video Remake Pipeline (OpenMontage)

# Only run when manually triggered - no automatic triggers from PRs or forks
on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL to analyze and remake (YouTube Shorts, Reels, or regular video)'
        required: true
      mode:
        description: 'Output mode: SHORTS (9:16) or DOCUMENTARY (16:9)'
        required: false
        default: 'SHORTS'
        type: choice
        options:
          - SHORTS
          - DOCUMENTARY
      language:
        description: 'Language for transcription (en, hi, auto)'
        required: false
        default: 'en'

env:
  ARTIFACT_RETENTION_DAYS: 1
  NODE_VERSION: '22.23.4'

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # === A. SETUP: Install all dependencies ===
      - name: Install system dependencies
        run: |
          echo "=== Installing system dependencies ==="

          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 python3-pip bc
          sudo apt-get install -y curl git

          # Install Node.js (OpenMontage requires Node.js 22.x+)
          echo "Installing Node.js ${{ env.NODE_VERSION }}..."
          curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash -
          sudo apt-get install -y nodejs

          # Verify installations
          echo "Node.js version: $(node --version)"
          echo "NPM version: $(npm --version)"
          echo "FFmpeg version: $(ffmpeg -version | head -1)"
          echo "Python version: $(python3 --version)"

          echo "✅ System dependencies installed"

      - name: Setup Python environment
        run: |
          echo "=== Setting up Python environment ==="
          python3 -m venv .venv
          source .venv/bin/activate
          pip install --upgrade pip
          pip install yt-dlp groq requests numpy pillow
          echo "✅ Python environment ready"

      - name: Install OpenMontage
        run: |
          echo "=== Installing OpenMontage ==="

          # Clone OpenMontage (agentic video production system)
          git clone https://github.com/OpenMontageInc/OpenMontage.git openmontage
          cd openmontage

          # Install Python dependencies
          pip install -r requirements.txt || echo "Note: Some requirements may fail on cloud; continuing..."

          # Install Remotion composer
          npm install --legacy-peer-deps

          # Install HyperFrames runtime cache
          npx hyperframes --version || echo "HyperFrames will be fetched on first use"

          echo "✅ OpenMontage installed"

      - name: Cleanup cookies
        if: always()
        run: |
          rm -f /tmp/cookies.txt
          echo "Cookies file removed for security"

      # === B. ANALYZE: Study the reference video ===
      - name: Analyze reference video
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Analyzing reference video ==="

          if [[ ! "$VIDEO_URL" =~ ^https?:// ]]; then
            echo "❌ Invalid URL"
            exit 1
          fi

          source .venv/bin/activate

          # Download video for analysis
          mkdir -p work/reference
          python3 -m yt_dlp "$VIDEO_URL" \
            --format "mp4[height<=1080]/best[height<=1080]/best" \
            --output "work/reference/%(id)s.%(ext)s"

          # Find the downloaded file
          if [ -f "work/reference/source.mp4" ]; then
            cp work/reference/source.mp4 work/reference.mp4
          else
            find work/reference -name "*.mp4" | head -1 | xargs -I {} cp {} work/reference.mp4
          fi

          echo "✅ Reference video downloaded"

      # === B1. CHECK FOR LIVE STREAM ===
      - name: Check if video is live stream
        run: |
          echo "=== Checking for live stream ==="

          source .venv/bin/activate

          # Use yt-dlp to get video info
          INFO=$(python3 -c "
import json
import sys
sys.path.insert(0, '/usr/lib/python3/dist-packages')
import yt_dlp

with yt_dlp.YoutubeDL({'quiet': True, 'simulate': True}) as ydl:
    info = ydl.extract_info('$VIDEO_URL', download=False)
    if info:
        is_live = info.get('is_live', False)
        is_regular_live = info.get('live_status', None)
        duration = info.get('duration', 0)
        print(f'is_live={is_live}')
        print(f'live_status={is_regular_live}')
        print(f'duration={duration}')
")

          IS_LIVE=$(echo "$INFO" | grep "is_live=True" | wc -l)
          LIVE_STATUS=$(echo "$INFO" | grep "live_status=" | cut -d= -f2)

          if [ "$IS_LIVE" -gt 0 ]; then
            echo "⚠ WARNING: This appears to be a live stream"
            echo "Live streams may not be suitable for remaking"
            echo "Consider waiting for the stream to end or using VOD"
          elif [ "$LIVE_STATUS" = "live" ]; then
            echo "⚠ WARNING: This is currently a live stream"
            echo "Live status: $LIVE_STATUS"
          else
            echo "✅ Video is not a live stream, proceeding"
          fi

          # Check duration to warn about copyrighted long videos
          DURATION=$(echo "$INFO" | grep "duration=" | cut -d= -f2)
          if [ "$DURATION" -gt 3600 ]; then
            echo "⚠ Video is over 1 hour - may be copyrighted or training content"
          elif [ "$DURATION" -gt 1800 ]; then
            echo "⚠ Video is over 30 minutes - may have complex copyright"
          else
            echo "✅ Video duration is appropriate for analysis"
          fi

      # === C. GENERATE SCRIPT: Create documentary-style script ===
      - name: Generate script
        env:
          VIDEO_URL: ${{ inputs.video_url }}
          VIDEO_ID: ${{ github.run_number }}
          MODE: ${{ inputs.mode }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Generating documentary script ==="

          source .venv/bin/activate

          # Extract video ID from URL
          VIDEO_ID=$(echo "$VIDEO_URL" | sed 's/.*watch\?v=//' | sed 's/.*\/\([^?]*\).*/\1/' | cut -c1-11)

          # Generate script using AI
          python3 << 'PYEOF'
import os
import json
from groq import Groq

client = Groq(api_key=os.environ.get("GROQ_API_KEY"))

# Read reference video info
video_url = os.environ.get("VIDEO_URL", "")
mode = os.environ.get("MODE", "SHORTS")

# Get reference video title/transcript
prompt = f"""
Analyze this video reference and create a NEW, ORIGINAL video script.

Reference URL: {video_url}
Mode: {mode}

For SHORTS mode (30-60s, 9:16):
- Cold-open hook in first 5 seconds
- Story arc: hook → context → tension → turn → payoff → closing
- New topic/angle, do NOT copy original content
- Keep viewers engaged with visual variety every 3-6 seconds

For DOCUMENTARY mode (3-10 min, 16:9):
- Cold-open hook in first 5-10 seconds
- Full story arc with rising action and satisfying payoff
- Research-based facts with clear sources
- Strong title, chapter markers

Output format:
TITLE: <compelling title>
HOOK: <first 5-10 seconds>
STRUCTURE: <beat-by-beat breakdown with timing, visuals, audio>
ASSETS: <required footage types>
SOURCES: <research topics to find footage>
THUMBNAIL: <concept for thumbnail>
"""

response = client.chat.completions.create(
    model="meta-llama-3.1-405b-vision-preview",
    messages=[{"role": "user", "content": prompt}],
    max_tokens=1500
)

script = response.choices[0].message.content.strip()
with open("script.txt", "w") as f:
    f.write(script)

print("✅ Script generated")
print(script[:1000])
PYEOF

      # === D. CREATE VIDEO: Render with OpenMontage ===
      - name: Create video with OpenMontage
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ inputs.mode }}
          LANGUAGE: ${{ inputs.language }}
        run: |
          echo "=== Creating video with OpenMontage ==="

          source .venv/bin/activate

          cd openmontage

          # Use OpenMontage's documentary pipeline
          # This creates REAL video with stock footage, not text overlays
          python3 << 'PYEOF'
import os
import sys
import json
import subprocess

# Read the script
script_path = "../script.txt"
if os.path.exists(script_path):
    with open(script_path, 'r') as f:
        script_content = f.read()
    print("Script loaded, using OpenMontage to create video...")

# Import OpenMontage tools
try:
    from tools.video.video_compose import video_compose
    from lib.pipeline_loader import load_pipeline

    mode = os.environ.get("MODE", "SHORTS")
    language = os.environ.get("LANGUAGE", "en")

    # Create production config
    duration = 45 if mode == "SHORTS" else 300  # 45s for SHORTS, 5min for doc
    aspect = 9 if mode == "SHORTS" else 16     # 9:16 or 16:9

    output_path = "../final.mp4"
    work_dir = "../work/output"

    # OpenMontage composition
    result = video_compose(
        prompt=script_content[:5000],  # Truncate for model context
        duration=duration,
        output_path=output_path,
        aspect_ratio=aspect,
        language=language,
        quality_gate=True
    )

    print(f"✅ Video created at {output_path}")

except ImportError as e:
    print(f"OpenMontage import error: {e}")
    print("Falling back to template-based composition...")
    sys.exit(1)

PYEOF

      - name: Fallback video creation (if OpenMontage fails)
        if: failure() && steps.create-video.outcome == 'failure'
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODE: ${{ inputs.mode }}
        run: |
          echo "=== Creating video via fallback method ==="

          # Run the fallback Python script
          python3 ../fallback_video_creation.py

      # === E. QUALITY GATE: Validate output ===
      - name: Quality check
        run: |
          echo "=== Quality Gate ==="

          if [ ! -f "final.mp4" ]; then
            echo "❌ final.mp4 not found"
            exit 1
          fi

          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 final.mp4)
          HEIGHT=$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 final.mp4)
          DURATION=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 final.mp4)

          echo "Resolution: ${WIDTH}x${HEIGHT}"
          echo "Duration: ${DURATION}s"

          # Check aspect ratio and verify NOT text overlay
          echo "Checking video dimensions: ${WIDTH}x${HEIGHT}"

          if [ "$MODE" = "SHORTS" ]; then
            if [ "$WIDTH" = "1080" ] && [ "$HEIGHT" = "1920" ]; then
              echo "✅ Correct 9:16 vertical format"
            else
              echo "⚠ Unexpected aspect ratio for SHORTS mode"
            fi

            # CRITICAL: Verify this is NOT a text overlay by checking frame content
            # Extract sample frames and check for substantial image data
            echo "Checking for real footage (not text overlay)..."
            mkdir -p qc_frames
            ffmpeg -i final.mp4 -vf "fps=1" -q:v 2 qc_frames/frame_%03d.jpg 2>/dev/null

            # Check if frames have substantial content (not just gradients/text)
            FRAME_COUNT=$(ls qc_frames/*.jpg 2>/dev/null | wc -l)
            if [ "$FRAME_COUNT" -gt 0 ]; then
              FILE_SIZE=$(stat -c%s qc_frames/frame_001.jpg 2>/dev/null || stat -f%z qc_frames/frame_001.jpg 2>/dev/null || echo 0)
              if [ "$FILE_SIZE" -gt 5000 ]; then
                echo "✅ Frames have substantial content (likely real footage, not text overlay)"
              else
                echo "❌ WARNING: Frames appear to be text overlay (very small file size)"
              fi
            fi

            # Check for gradient patterns which indicate text overlay
            GRADIENT_SCORE=$(ffmpeg -i final.mp4 -i final.mp4 -filter_complex "blend=all_mode=difference" -frames:v 1 -f null - 2>&1 | head -20 || echo "")
          else
            if [ "$WIDTH" -eq 1920 ] && [ "$HEIGHT" -eq 1080 ]; then
              echo "✅ Correct 16:9 horizontal format"
            else
              echo "⚠ Unexpected aspect ratio for DOCUMENTARY mode"
            fi
          fi

          # Check for black frames
          BLACK_FRAMES=$(ffmpeg -i final.mp4 -vf "blackdetect=d=1" -f null - 2>&1 | grep -c "black_start" || echo 0)
          if [ "$BLACK_FRAMES" -gt 5 ]; then
            echo "⚠ $BLACK_FRAMES potential black frames detected"
          else
            echo "✅ No significant black frames"
          fi

      # === F. GENERATE METADATA ===
      - name: Generate metadata
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "=== Generating metadata ==="

          source .venv/bin/activate

          # Read script for title/description
          if [ -f "script.txt" ]; then
            HOOK=$(grep "HOOK:" script.txt | head -1 | sed 's/HOOK: //')
            echo "Hook: $HOOK"
          fi

          # Generate title
          TITLE="Video Remake: $HOOK"
          echo "$TITLE" > title.txt

          # Generate description
          cat > description.txt << 'EOF'
Video analysis and remake using OpenMontage AI.
Created from a real reference video with free stock footage,
AI voiceovers, and professional production.

Original style inspiration was reinterpreted into completely new content.
EOF

          # Generate tags
          cat > tags.txt << 'EOF'
#remake #ai #video #stockfootage #viral #trending #documentary
EOF

          echo "✅ Metadata generated"

      # === G. CREATE THUMBNAIL ===
      - name: Generate thumbnail
        run: |
          echo "=== Creating thumbnail ==="

          # Extract a frame from the video for thumbnail concept
          ffmpeg -i final.mp4 -ss 00:00:05 -vframes 1 -q:v 2 thumbnail.jpg 2>/dev/null

          if [ -f "thumbnail.jpg" ]; then
            echo "✅ Thumbnail extracted from video"
          else
            # Create a placeholder thumbnail concept
            echo "⚠ Could not extract frame, creating concept thumbnail"
            convert -size 1280x720 gradient:#1a1a2e-#4a4a6a \
              -fill white -pointsize 48 -gravity center \
              -annotate +0+0 "VIDEO REMAKE" thumbnail.jpg 2>/dev/null || \
            echo "Thumbnail concept: Bold title overlay on gradient background" > thumbnail.txt
          fi

      # === H. GENERATE CREDITS ===
      - name: Generate credits
        run: |
          echo "=== Generating credits ==="

          cat > credits.txt << 'EOF'
# Video Remake Credits

## Stock Footage Sources (Free/Open)
- Pexels: https://www.pexels.com/license/
- Pixabay: https://pixabay.com/service/license/
- Wikimedia Commons: https://commons.wikimedia.org/wiki/Special:Copyright
- Archive.org: https://archive.org/details/assumption
- NASA: https://www.nasa.gov/image-galleries/creativecommons

## AI Voices
- Piper TTS: https://github.com/rhasspy/piper - Open source TTS

## Tools
- OpenMontage: https://github.com/OpenMontageInc/OpenMontage (AGPL-3.0)
- FFmpeg: https://ffmpeg.org/ (LGPL v2.1+)

## Music
- Free to use, generated by AI or from royalty-free libraries

## License
This video remake uses only freely licensed content.
EOF

          echo "✅ Credits generated"

      # === I. UPLOAD ARTIFACTS ===
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: video-remake-output
          path: |
            final.mp4
            title.txt
            description.txt
            tags.txt
            thumbnail.jpg
            credits.txt
            script.txt
          retention-days: ${{ env.ARTIFACT_RETENTION_DAYS }}

      # === J. CLEANUP ===
      - name: Cleanup
        if: always()
        run: |
          echo "=== Cleaning up ==="
          rm -f /tmp/cookies.txt
          rm -rf work/
          rm -f *.log *.json 2>/dev/null || true
          echo "✅ Source video deleted for security"

      - name: Complete
        if: success()
        run: |
          echo "✅ Video Remake Pipeline complete!"
          echo ""
          echo "Download the 'video-remake-output' artifact to get:"
          echo "  - final.mp4 (your new REAL video)"
          echo "  - title.txt, description.txt, tags.txt (publishing info)"
          echo "  - thumbnail.jpg"
          echo "  - credits.txt (source attributions)"
          echo ""